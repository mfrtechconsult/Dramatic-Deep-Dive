name: Kanto seabed contract

on:
  pull_request:
    paths:
      - "dramatic_deep_dive/**"
      - ".github/workflows/kanto-seabed-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seabed-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
      - name: Test generated water atlas and seams
        run: lua5.4 dramatic_deep_dive/tools/test_kanto_water_atlas.lua
      - name: Test exact full-water coverage audit
        run: lua5.4 dramatic_deep_dive/tools/test_seabed_audit.lua
      - name: Test surface-aware seabed landmarks
        run: lua5.4 dramatic_deep_dive/tools/test_seabed_landmarks.lua
      - name: Test exact surface warp/object anchors
        run: lua5.4 dramatic_deep_dive/tools/test_surface_landmark_anchors.lua
      - name: Test full-Kanto no-mask and submerged portals
        run: lua5.4 dramatic_deep_dive/tools/test_full_kanto_mode.lua
