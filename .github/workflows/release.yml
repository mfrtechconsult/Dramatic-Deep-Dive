name: Publish mod release

on:
  push:
    branches: [main]
    paths:
      - dramatic_deep_dive/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install validators and preview renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 librsvg2-bin

      - name: Validate standalone Deep Dive
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool dramatic_deep_dive/manifest.json >/dev/null
          python3 dramatic_deep_dive/tools/audit_independence_contract.py dramatic_deep_dive
          python3 dramatic_deep_dive/tools/audit_hm_contract.py dramatic_deep_dive
          while IFS= read -r -d '' file; do luac5.4 -p "$file"; done \
            < <(find dramatic_deep_dive -type f -name '*.lua' -print0)
          lua5.4 dramatic_deep_dive/tools/test_compat_contract.lua dramatic_deep_dive/
          lua5.4 dramatic_deep_dive/tools/test_voxel_providers.lua dramatic_deep_dive/
          lua5.4 dramatic_deep_dive/tools/validate_scene.lua
          lua5.4 dramatic_deep_dive/tools/validate_travel.lua

      - name: Generate real-data map previews
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p previews
          lua5.4 dramatic_deep_dive/tools/render_previews.lua previews
          for svg in previews/*.svg; do
            png="${svg%.svg}.png"
            rsvg-convert -s 2 "$svg" -o "$png"
          done

      - name: Read mod version
        id: version
        shell: bash
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("dramatic_deep_dive/manifest.json", encoding="utf-8"))["version"])')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build launcher-ready ZIP
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          ZIP="Dramatic-Deep-Dive-${VERSION}-Launcher-Ready.zip"
          (
            cd dramatic_deep_dive
            zip -r "../$ZIP" . -x '*.DS_Store'
          )
          test "$(unzip -Z1 "$ZIP" | grep -Ec '^manifest\.json$')" -eq 1
          test "$(unzip -Z1 "$ZIP" | grep -Ec '^main\.lua$')" -eq 1
          if unzip -Z1 "$ZIP" | grep -Eq '^dramatic_deep_dive/'; then
            echo "Launcher ZIP unexpectedly contains a top-level dramatic_deep_dive directory" >&2
            exit 1
          fi
          sha256sum "$ZIP" > "$ZIP.sha256"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "SHA_FILE=$ZIP.sha256" >> "$GITHUB_ENV"

      - name: Create or refresh GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          LEGACY_ZIP="dramatic_deep_dive-v${VERSION}.zip"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Dramatic Deep Dive ${VERSION}" \
              --prerelease=false
            gh release delete-asset "$TAG" "$LEGACY_ZIP" -y >/dev/null 2>&1 || true
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Dramatic Deep Dive ${VERSION}" \
              --generate-notes
          fi

          gh release upload "$TAG" "$ZIP" "$SHA_FILE" --clobber
          for png in previews/*.png; do
            gh release upload "$TAG" "$png" --clobber
          done

          gh release view "$TAG" --json url,name,tagName,isPrerelease
