name: Publish mod release

on:
  push:
    branches:
      - main
    paths:
      - dramatic_deep_dive/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install validators and preview renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 librsvg2-bin

      - name: Validate mod sources
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool dramatic_deep_dive/manifest.json >/dev/null
          while IFS= read -r -d '' file; do
            luac5.4 -p "$file"
          done < <(find dramatic_deep_dive -type f -name '*.lua' -print0)
          lua5.4 dramatic_deep_dive/tools/validate_scene.lua
          lua5.4 dramatic_deep_dive/tools/validate_travel.lua

      - name: Generate real-data map previews
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p previews
          lua5.4 dramatic_deep_dive/tools/render_previews.lua previews
          for svg in previews/*.svg; do
            png="${svg%.svg}.png"
            rsvg-convert -s 2 "$svg" -o "$png"
          done

      - name: Read mod version
        id: version
        shell: bash
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("dramatic_deep_dive/manifest.json", encoding="utf-8"))["version"])')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build installable ZIP
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ZIP="dramatic_deep_dive-v${VERSION}.zip"
          zip -r "$ZIP" dramatic_deep_dive
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi
          gh release create "$TAG" \
            "$ZIP#Dramatic Deep Dive ${VERSION} (installable ZIP)" \
            previews/*.png \
            --target "$GITHUB_SHA" \
            --title "Dramatic Deep Dive ${VERSION}" \
            --prerelease \
            --generate-notes
